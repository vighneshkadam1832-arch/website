<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<style>
body{
    font-family:'Segoe UI', Arial, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background: 
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(99, 102, 241, 0.3), transparent 70%),
        radial-gradient(ellipse 60% 40% at 100% 40%, rgba(6, 182, 212, 0.22), transparent 60%),
        radial-gradient(ellipse 60% 40% at 0% 80%, rgba(139, 92, 246, 0.25), transparent 60%),
        #0b0f19;
    color: #f8fafc;
}

.box{
    width:380px;
    background: rgba(17, 24, 39, 0.82);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    padding:35px 30px;
    border-radius:20px;
    text-align:center;
    box-shadow: 0 25px 60px rgba(0,0,0,0.5), 0 0 35px rgba(99, 102, 241, 0.25);
}

.box h2 {
    font-size: 26px;
    margin-bottom: 20px;
    color: #ffffff;
}

input{
    width:100%;
    padding:14px;
    margin:10px 0;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(15, 23, 42, 0.7);
    color: #ffffff;
    font-size: 15px;
    outline: none;
    transition: all 0.3s ease;
}

input:focus {
    border-color: #6366f1;
    box-shadow: 0 0 15px rgba(99, 102, 241, 0.3);
}

button{
    width:100%;
    padding:14px;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color:white;
    font-size: 16px;
    font-weight: 700;
    border:none;
    border-radius: 10px;
    cursor:pointer;
    margin-top: 15px;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(99, 102, 241, 0.6);
}
</style>

</head>
<body>

<div class="box">

<h2>Login</h2>

<input type="email" id="email" placeholder="Email">

<input type="password" id="password" placeholder="Password">

<button onclick="login()">Login</button>

</div>

<script>
function login(){

let email=document.getElementById("email").value;
let password=document.getElementById("password").value;

let savedEmail=localStorage.getItem("email");
let savedPassword=localStorage.getItem("password");

if(email===savedEmail && password===savedPassword){

alert("Login Successful");
window.location.href="index.html";

}else{

alert("Invalid Email or Password");

}

}
</script>

</body>
</html>
